[project]
name = "Conventor EFKI"
version = "2.0.0"
description = "..."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "customtkinter==5.2.2",
    "loguru>=0.7.3",
    "openpyxl>=3.1.2",
    "pandas==2.2.3",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.7",
    "pytest==8.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PTH",
    "T20",
    "RET",
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "customtkinter.*",
    "loguru.*",
    "openpyxl.*",
    "pandas.*",
    "xlrd.*",
]
ignore_missing_imports = true

[tool.setuptools]
packages = []
